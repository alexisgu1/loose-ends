name: LooseEnds
options:
  bundleIdPrefix: com.alexisgu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LooseEnds:
    type: application
    platform: iOS
    sources: [LooseEnds]
    dependencies:
      - target: LooseEndsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexisgu.looseends
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Loose Ends
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Loose Ends talks to the companion app on your Mac, which reads your messages.
    info:
      path: LooseEnds/Info.plist
      properties:
        NSAppTransportSecurity:
          # The Mac companion is plain http on your own Mac or Wi-Fi.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.alexisgu.looseends
            CFBundleURLSchemes: [looseends]

  # The weekly "make plans" Live Activity (lock screen + Dynamic Island).
  LooseEndsWidget:
    type: app-extension
    platform: iOS
    sources:
      - LooseEndsWidget
      - LooseEnds/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexisgu.looseends.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Loose Ends
        SKIP_INSTALL: YES
    info:
      path: LooseEndsWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
