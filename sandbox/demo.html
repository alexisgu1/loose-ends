<title>Loose Ends</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root { --page: #111214; --ink: #f2f2f3; --muted: #8b8d93; --line: #2a2b2f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  header.top h1 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; }
  header.top a { color: var(--muted); }
  button.ui { font: inherit; color: var(--ink); background: #1d1e21; border: 1px solid var(--line); padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  main { display: flex; flex-wrap: wrap; gap: 40px 32px; padding: 28px 24px 80px; }
  figure { margin: 0; width: calc(402px * var(--fit, 1)); }
  figcaption b { font-size: 15px; }
  figcaption span { display: block; color: var(--muted); margin: 2px 0 12px; }
  @media (max-width: 600px) { main { padding: 20px 16px 60px; } header.top { padding: 12px 16px; } }

  /* Phone: near-black with soft color glows so the glass has something to frost */
  .phone { zoom: var(--fit, 1); width: 402px; height: 874px; border-radius: 54px; overflow: hidden; position: relative; color: #fff; letter-spacing: -0.01em; user-select: none;
    box-shadow: 0 0 0 10px #050506, 0 0 0 11px #2a2b2f;
    background: #000; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 50; }
  .homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.7); z-index: 50; }
  .title { position: absolute; top: 72px; left: 16px; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.02em; }

  /* Glass */
  .glass { background: rgba(255,255,255,.07); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.16), inset 0 1px 0 rgba(255,255,255,.12); }

  /* Deck: cards stacked, the next ones peek out behind */
  .deck { position: absolute; top: 144px; left: 16px; right: 16px; bottom: 152px; }
  .card { position: absolute; inset: 0; border-radius: 32px; padding: 20px; display: flex; flex-direction: column; background: #161618;
    box-shadow: 0 0 0 .5px rgba(255,255,255,.08), 0 20px 40px rgba(0,0,0,.5); transform-origin: 50% 100%;
    transition: transform .5s cubic-bezier(.22,1,.36,1), opacity .5s ease, filter .5s ease, background-color .5s ease; touch-action: none; }
  .card.top { cursor: grab; }
  .who { display: flex; align-items: center; gap: 12px; }
  .photo { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 17px; font-weight: 600; background: linear-gradient(180deg, #a5a9b4, #7d818c); }
  .who b { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .who span { display: block; font-size: 15px; color: rgba(255,255,255,.45); margin-top: 2px; }
  .plan { margin-top: 20px; font-size: 24px; line-height: 32px; letter-spacing: -.02em; outline: none; }
  .acts { display: flex; gap: 16px; margin-top: 16px; }
  .acts .x { width: 56px; height: 56px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; cursor: pointer; display: grid; place-items: center; }
  .acts .x svg { width: 18px; height: 18px; }
  .acts .send { flex: 1; height: 56px; border-radius: 28px; border: 0; background: #fff; color: #000; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }

  /* Glass evening calendar */
  .cal { margin-top: 40px; flex: 1; min-height: 0; position: relative; color: #000; }
  .tl { position: absolute; inset: 0; }
  .hr { position: absolute; left: var(--gut, 72px); right: 0; border-top: 1px solid rgba(0,0,0,.07); }
  .hl { position: absolute; left: 0; font-size: 12px; font-weight: 500; color: rgba(0,0,0,.4); transform: translateY(-8px); font-variant-numeric: tabular-nums; }
  .busy { position: absolute; left: var(--gut, 72px); right: 0; border-radius: 12px; background: #f2f2f4; display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: rgba(0,0,0,.35); overflow: hidden; }
  .ev { position: absolute; left: var(--gut, 72px); right: 0; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; background: #000; color: #fff; }
  .ev b { font-size: 15px; font-weight: 600; } .ev span { font-size: 13px; color: rgba(255,255,255,.65); }
  /* W4: the day fades out above and below, like a window onto it */
  .fade .tl { -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
  /* Horizontal strip */
  .strip { position: relative; height: 40px; border-radius: 12px; background: #f6f6f8; overflow: hidden; }
  .strip .sb { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 1px, transparent 1px 6px); }
  .strip .se { position: absolute; top: 0; bottom: 0; border-radius: 12px; background: #000; }
  .strip .st { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,.06); }
  .ticks { position: relative; height: 16px; margin-top: 8px; font-size: 12px; color: rgba(0,0,0,.4); font-variant-numeric: tabular-nums; }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .ticks span:first-child { transform: none; } .ticks span:last-child { transform: translateX(-100%); }
  .what { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; font-size: 15px; }
  .what b { font-weight: 600; } .what span { color: rgba(0,0,0,.45); }
  /* Big time */
  .big { margin-top: auto; }
  .big small { display: block; font-size: 15px; color: rgba(0,0,0,.45); }
  .big strong { display: block; font-size: 44px; line-height: 52px; font-weight: 600; letter-spacing: -.03em; margin: 4px 0 20px; font-variant-numeric: tabular-nums; }

  .card { background: #fff; color: #000; }
  .card:not(.top) { background: #e9e9ec; }
  .photo { color: #fff; }
  .hug .card { bottom: auto; }
  .now { position: absolute; left: 50px; right: 16px; height: 1.5px; background: rgba(255,255,255,.7); }
  .now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: #fff; }

  /* Bottom: three ways to show what's left */
  .rail { position: absolute; left: 16px; right: 16px; bottom: 40px; height: 64px; border-radius: 32px; display: flex; align-items: center; padding: 0 20px; gap: 8px; }
  /* R1 faces */
  .rail .f { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 600; opacity: .4;
    background: linear-gradient(180deg, #a5a9b4, #7d818c); transition: opacity .25s, transform .25s; cursor: pointer; flex: none; }
  .rail .f.on { opacity: 1; }
  .rail .f.done { opacity: .15; }
  .rail .count { margin-left: auto; padding-right: 0; font-size: 15px; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; }
  /* R2 your week */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; text-align: center; }
  .week div { font-size: 11px; color: rgba(255,255,255,.4); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .week i { display: flex; gap: 2px; height: 8px; }
  .week i em { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .week i em.next { background: transparent; box-shadow: inset 0 0 0 1.2px rgba(255,255,255,.6); }
  .week b { font-size: 15px; color: #fff; font-weight: 500; }
  /* R3 progress line with names */
  .names { display: flex; width: 100%; padding: 0 12px; gap: 12px; align-items: center; font-size: 15px; overflow: hidden; }
  .names span { color: rgba(255,255,255,.3); white-space: nowrap; transition: color .25s; }
  .names span.on { color: #fff; font-weight: 600; }
  .names span.done { color: rgba(255,255,255,.18); text-decoration: line-through; }
  .names .bar { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); position: relative; min-width: 24px; }
  .names .bar i { position: absolute; inset: 0; right: auto; border-radius: 2px; background: #fff; }

  .done-msg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; font-weight: 700; }

  /* Type: three styles only. Title 34/700 · Message 22/400 · Label 15/500 */
  .title, .big strong { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.02em; }
  .plan { font-size: 22px; line-height: 30px; font-weight: 400; letter-spacing: -.01em; }
  .who b, .photo, .hl, .busy, .ev b, .ev span, .rail .f, .rail .count, .ticks, .what, .what b, .big small, .done-msg {
    font-size: 15px; line-height: 20px; font-weight: 500; letter-spacing: -.01em; }
  .hl { transform: translateY(-10px); white-space: nowrap; }
  .big strong { margin: 4px 0 20px; }
  /* No pill: faces sit straight on black, lined up with the card */
  .rail.glass { background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }

  /* counter alternatives */
  .rail .count.frac { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.02em; color: rgba(255,255,255,.3); }
  .rail .count.frac b { color: #fff; font-weight: 700; }
  .rail.bar { flex-wrap: wrap; align-content: center; row-gap: 12px; }
  .pbar { position: relative; flex-basis: 100%; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); }
  .pbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: rgba(255,255,255,.35); }
  .pbar em { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: #fff; transition: left .3s; }
  .rail .f { position: relative; }
  .rail .f .ck { position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 2px #000; }
  .rail .f.sent { opacity: .6; }
  .rail .f.more { background: rgba(255,255,255,.12); opacity: 1; margin-left: -12px; box-shadow: 0 0 0 3px #000; }

  /* one dim level */
  .rail .f { opacity: .35; } .rail .f.on { opacity: 1; } .rail .f.done { opacity: .35; }
  .rail .f.ring { box-shadow: 0 0 0 2px #000, 0 0 0 4px #fff; }
  .rail .f.swap { background: rgba(255,255,255,.14); color: #fff; }

  .end { position: absolute; top: 144px; left: 16px; right: 16px; }
  .end .photo { color: #fff; }
  .photo.sm { width: 24px; height: 24px; font-size: 11px; }
  .end span { font-size: 15px; line-height: 20px; font-weight: 500; color: rgba(255,255,255,.5); }
  .end b { font-weight: 500; color: #fff; }
  .pl { font-size: 22px; line-height: 30px; font-weight: 400; letter-spacing: -.01em; }
  .er, .wk, .ct, .tk { opacity: 0; animation: efIn .5s cubic-bezier(.2,.8,.2,1) forwards; }

  /* E1 week */
  .wgrid { display: grid; grid-template-columns: repeat(7, 1fr); height: 300px; border-radius: 24px; background: #111113; padding: 16px 4px; }
  .wc { display: flex; flex-direction: column; align-items: center; }
  .wc small { font-size: 15px; line-height: 20px; font-weight: 500; color: rgba(255,255,255,.35); }
  .wc b { font-size: 15px; line-height: 32px; width: 32px; text-align: center; border-radius: 50%; margin-top: 4px; }
  .wc.today b { background: #fff; color: #000; }
  .wl { position: relative; flex: 1; width: 1px; margin-top: 12px; background: rgba(255,255,255,.08); }
  .wf { position: absolute; left: 50%; transform: translate(-50%, -50%); }
  .wf .photo { box-shadow: 0 0 0 3px #111113; }
  .wlist { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
  .wk { display: flex; align-items: center; gap: 12px; }

  /* E2 tiles */
  .e-tiles { display: flex; flex-direction: column; gap: 20px; }
  .e-tiles .er { display: flex; align-items: center; gap: 16px; }
  .tile { position: relative; width: 64px; height: 64px; border-radius: 16px; background: #fff; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
  .tile small { font-size: 15px; line-height: 16px; font-weight: 500; color: rgba(0,0,0,.45); }
  .tile b { color: #000; font-size: 34px; line-height: 36px; font-weight: 700; letter-spacing: -.02em; }
  .photo.badge { position: absolute; right: -8px; bottom: -8px; width: 28px; height: 28px; font-size: 13px; box-shadow: 0 0 0 3px #000; }

  /* E3 tickets */
  .e-wallet { height: 460px; }
  .tk { position: absolute; left: 0; right: 0; height: 200px; border-radius: 28px; background: #fff; color: #000; padding: 20px; box-shadow: 0 -8px 24px rgba(0,0,0,.4); }
  .tk:not(:first-child) { background: #e9e9ec; }
  .tk-hd { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .tk-day { font-size: 22px; line-height: 30px; font-weight: 400; }
  .tk span { color: rgba(0,0,0,.45); }
  .tk .pl { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.02em; }

  /* E4 countdown */
  .e-count { padding-left: 24px; border-left: 1px solid rgba(255,255,255,.15); margin-left: 4px; display: flex; flex-direction: column; gap: 28px; }
  .ct { position: relative; }
  .ct i { position: absolute; left: -29px; top: 13px; width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px #000; }
  .ct-day { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.02em; }
  .ct:not(:first-child) .ct-day { color: rgba(255,255,255,.5); }
  .ct-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .end-acts { position: absolute; left: 16px; right: 16px; bottom: 40px; display: flex; flex-direction: column; gap: 8px; opacity: 0; animation: efIn .5s .4s ease-out forwards; }
  .end-acts button { height: 56px; border-radius: 28px; border: 0; font: inherit; font-size: 15px; line-height: 20px; font-weight: 500; letter-spacing: -.01em; cursor: pointer; }
  .btn1 { background: #fff; color: #000; }
  .btn2 { background: none; color: #fff; }
  @keyframes efIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .end.c { top: 288px; bottom: auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding: 0 20px; }
  .efs { display: flex; margin-bottom: 24px; }
  .ef { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 400; color: #fff; position: relative;
    background: linear-gradient(180deg, #a5a9b4, #7d818c); box-shadow: 0 0 0 4px #000; margin: 0 -8px; opacity: 0; animation: efIn .5s cubic-bezier(.2,.8,.2,1) forwards; }
  .et { font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; opacity: 0; animation: efIn .5s .2s ease-out forwards; }

  /* Buttons use the Label style from the deck */
  .end-acts button { font-family: inherit; font-size: 15px; line-height: 20px; font-weight: 500; letter-spacing: -.01em; }
  .end-acts button:disabled { opacity: .3; cursor: default; }
  /* Next week picker: faces dim until picked; picked get the check */
  .pks { position: absolute; top: 144px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 16px; }
  .pk { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0; background: none; border: 0; color: #fff; text-align: left; cursor: pointer;
    font-family: inherit; opacity: 0; animation: efIn .5s cubic-bezier(.2,.8,.2,1) forwards; }
  .pk .photo { width: 64px; height: 64px; font-size: 22px; font-weight: 400; color: #fff; position: relative; opacity: .35; transition: opacity .3s ease; }
  .pk span { font-size: 22px; line-height: 30px; font-weight: 400; letter-spacing: -.01em; color: rgba(255,255,255,.35); transition: color .3s ease; }
  .pk .ck { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 3px #000; opacity: 0; transform: scale(.6); transition: opacity .3s ease, transform .3s ease; }
  .pk.on .photo { opacity: 1; } .pk.on span { color: #fff; } .pk.on .ck { opacity: 1; transform: none; }
  .phone > .title.in, .pks, .end.c { animation: efIn .5s ease-out both; }

  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 80; }
  .cf { position: absolute; z-index: 80; pointer-events: none; line-height: 1; margin: -.5em 0 0 -.5em; }

  /* Randomize controls */
  .dice { border: 0; background: rgba(255,255,255,.16); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; margin-right: -6px; }
  .dice:active { transform: scale(.9); }
  .dice.corner { margin-left: auto; background: #f2f2f4; color: #000; }
  .surprise { align-self: flex-start; margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: #f2f2f4; color: #000;
    font-family: inherit; font-size: 15px; font-weight: 500; letter-spacing: -.01em; cursor: pointer; }
  .ev.tapme { cursor: pointer; } .ev .hint { opacity: .5; display: grid; }
  .ev { overflow: hidden; }
  .ev .fl { display: inline-block; font-style: normal; min-width: .62em; text-align: center; background: rgba(255,255,255,.12); border-radius: 3px; margin-right: 1px; }
  .reel { position: absolute; left: 14px; right: 14px; top: 0; }
  .reel div { display: flex; align-items: center; font-size: 15px; line-height: 20px; font-weight: 500; }
  .bigemo { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 28px; line-height: 1; }

  .ev { overflow: visible; }
  .dice.badge { position: absolute; right: -12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; background: #fff; color: #000; box-shadow: 0 0 0 3px #fff, 0 4px 12px rgba(0,0,0,.18); margin: 0; }
  .ev:has(.badge) { margin-right: 12px; }
  .surprise { margin-top: 16px; }

  /* scrolling day */
  .tls { position: absolute; top: 0; bottom: 0; left: -20px; right: -20px; padding: 0 20px; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain;
    -webkit-mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent); }
  .tls::-webkit-scrollbar { display: none; }
  .tls .tl { position: relative; inset: auto; -webkit-mask-image: none; mask-image: none; }
  .ev { transition: background-color .25s ease, box-shadow .4s ease, transform .4s cubic-bezier(.2,.8,.2,1); touch-action: none; }
  .ev .tm { font-size: 15px; font-weight: 500; color: rgba(255,255,255,.6); }
  .ev.lifted { transform: scale(1.03); box-shadow: 0 4px 12px rgba(0,0,0,.12); z-index: 5; transition: background-color .25s ease, box-shadow .3s ease, transform .3s cubic-bezier(.2,.8,.2,1); }
  .ev.blocked { background: #ff3b30; }
  .ev.blocked .tm, .ev.blocked b { color: #fff; }
  .card.locked { cursor: default; }

  /* while dragging, the time takes the dice's spot */
  .ev .tm:empty { display: none; }
  .ev.lifted .hint { display: none; }
  .ev .tm { margin-left: auto; }

  .ev { perspective: 600px; }
  .ev .die { position: absolute; left: 0; top: 50%; margin-top: -12px; font-size: 22px; line-height: 24px; pointer-events: none; }
  .ev .spark { position: absolute; font-size: 14px; pointer-events: none; }
  .ev b { display: inline-block; white-space: nowrap; }

  .ev.rolling { overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
  .ev .rolo { position: absolute; left: 14px; right: 14px; top: 0; }
  .ev .rolo div { display: flex; align-items: center; font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; }

  /* Keep the plan on its own layer all the time, so text renders the same flat or mid-flip (no "bold" flicker) */
  .ev { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .ev b, .ev .tm { -webkit-font-smoothing: antialiased; }

  /* Layout: intro column beside a full-size phone; stacks on narrow screens. Single dark look. */
  :root { --page: #0c0c0e; --ink: #f2f2f3; --muted: #9a9ca3; --line: #26272b; --panel: #151518; color-scheme: dark; }
  body { background: var(--page); color: var(--ink); }
  .wrap { display: flex; flex-wrap: wrap; gap: 40px 64px; justify-content: center; align-items: flex-start; max-width: 1040px; margin: 0 auto;
    padding-block: 48px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .intro { flex: 1 1 320px; max-width: 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding-top: 24px; }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .intro h1 { margin: -8px 0 0; font-size: 44px; line-height: 1.05; font-weight: 700; letter-spacing: -.03em; text-wrap: balance; }
  .lede { margin: 0; font-size: 17px; line-height: 1.5; color: var(--ink); }
  .note { font-size: 14px; line-height: 1.5; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .note b { color: var(--ink); font-weight: 600; }
  .try { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 15px; color: var(--muted); }
  .try b { color: var(--ink); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions .ui { font-size: 14px; padding: 9px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-decoration: none; cursor: pointer; }

const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>';

const VARIANTS = [

  { place: "Kang's", emoji: "🍲" }, { place: "No Thai", emoji: "🍜" }, { place: "South U Pizza", emoji: "🍕" },

const DICE = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="15" height="15" rx="4"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/><circle cx="13" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="13" cy="7" r="1.2" fill="currentColor" stroke="none"/><circle cx="7" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg>';

const escRe = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace("'", "['’]?");

function flapTo(b, next, done) {

function flipTo(b, next, done) {

function emojiTo(b, next, done) {

  card.style.transition = "transform .3s cubic-bezier(.4,0,.8,.6), opacity .3s";
  card.style.transform = `translateX(${dir * 460}px) rotate(${dir * 10}deg)`;
  card.style.opacity = "0";
  // the cards behind step forward at the same time
  [...card.parentElement.children].filter(c => c !== card).forEach(c => {
    const k = 10 - +c.style.zIndex - 1;
    c.style.transform = k <= 0 ? "none" : `translateY(${k * 14}px) scale(${1 - k * .05})`;
    c.style.opacity = k > 2 ? 0 : 1; c.style.filter = k <= 0 ? "none" : `brightness(${1 - k * .2})`;
    if (k <= 0) c.style.backgroundColor = "#fff";   // the next card brightens to white as it comes forward
  });
  const ph = card.closest(".phone"), name = card.dataset.name;
  if (dir > 0) confetti(ph, ideaFor(i, name).place);
  const last = card.parentElement.children.length === 1;
  if (last && dir > 0) {
    // last one: the check fades in on their face first, then the end screen
    const f = ph.querySelector(`.rail .f[data-n="${name}"]`);
    if (f && !f.querySelector(".ck")) { f.insertAdjacentHTML("beforeend", CK_SVG); f.querySelector(".ck").animate([{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "none" }], { duration: 400, delay: 150, easing: "ease-out", fill: "backwards" }); }
    ph.querySelector(".rail .count")?.animate([{ opacity: 1 }, { opacity: 1 }], { duration: 1 });
    setTimeout(() => { st.gone.push(name); st.sent.push(name); draw(i); }, 1300);
    return;
  }
  if (last && dir < 0) {
    // last one skipped: their face shrinks and fades out first, then the end screen
    const f = ph.querySelector(`.rail .f[data-n="${name}"]`);
    f?.animate([{ opacity: getComputedStyle(f).opacity, transform: "scale(1)" }, { opacity: 0, transform: "scale(.5)" }], { duration: 400, delay: 150, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" });
    setTimeout(() => { st.gone.push(name); draw(i); }, 900);
    return;
  }
  setTimeout(() => { st.gone.push(name); if (dir > 0) st.sent.push(name); draw(i); }, 520);
}
// Emoji confetti for the kind of plan: coffee gets coffee, Korean food gets Korean food.
const EMOJI = { "Sava's": "🍝🍷🥗", "Mister Spots": "🥪🍗🍟", "sweetgreen": "🥗🥑", "Kang's": "🍲🥢🍚", "No Thai": "🍜🥢🌶️",
  "South U Pizza": "🍕🥤", "BTB Burrito": "🌯🌮", "Good Time Charley's": "🍔🍻🍟", "Raising Cane's": "🍗🍟🥤" };
const GUESS = [[/coffee|cafe|roast|espresso/i, "☕️🥐"], [/boba|tea|bubble/i, "🧋"], [/pizza/i, "🍕"], [/sushi|ramen|noodle|turtle/i, "🍜🍣"],
  [/taco|mex/i, "🌮🌯"], [/burger/i, "🍔🍟"], [/ice cream|gelato|dessert/i, "🍦🍨"], [/bar|brew|beer/i, "🍻"]];
let CONFETTI = "cannons";
// Three styles. All start moving on the first frame (no delay, fastest at the start).
function confetti(ph, place = "") {
  const set = [...(EMOJI[place] || GUESS.find(([r]) => r.test(place))?.[1] || "🎉✨🥳")].filter(c => c.trim() && c !== "️");
  const N = CONFETTI === "cannons" ? 20 : CONFETTI === "rain" ? 36 : 30;
  for (let n = 0; n < N; n++) {
    const e = document.createElement("div"); e.className = "cf"; e.textContent = set[n % set.length];
    e.style.fontSize = (CONFETTI === "cannons" ? 32 + Math.random() * 16 : 20 + Math.random() * 14) + "px";
    let x0, y0, vx, vy, g, T, rot = (Math.random() - .5) * 540, delay = 0;
    if (CONFETTI === "rain") {            // falls in from above the screen, drifting
      x0 = Math.random() * 402; y0 = -40 - Math.random() * 120; vx = (Math.random() - .5) * 60; vy = 220 + Math.random() * 160; g = 500; T = 1.8 + Math.random() * .6;
    } else if (CONFETTI === "side") {     // flies out of the right edge, where the card went
      x0 = 410; y0 = 300 + Math.random() * 240; const a = (180 + 10 + Math.random() * 50) * Math.PI / 180, v = 500 + Math.random() * 400;
      vx = Math.cos(a) * v; vy = Math.sin(a) * v; g = 1100; T = 1.6 + Math.random() * .4;
    } else {                              // two cannons from the bottom corners, fired in two volleys
      const L = n % 2 === 0; x0 = L ? -10 : 412; y0 = 880; delay = n < 12 ? 0 : 220;
      const a = (L ? -55 - Math.random() * 30 : -125 + Math.random() * 30) * Math.PI / 180, v = 1050 + Math.random() * 450;
      vx = Math.cos(a) * v; vy = Math.sin(a) * v; g = 1250; T = 2 + Math.random() * .5; rot = (Math.random() - .5) * 900;
    }
    e.style.left = x0 + "px"; e.style.top = y0 + "px";
    fxLayer(ph).appendChild(e);
    const frames = [...Array(31)].map((_, k) => { const t = k / 30 * T;
      const sc = CONFETTI === "cannons" ? (k === 0 ? .4 : k === 1 ? 1.25 : k === 2 ? 1.1 : 1) : 1;
      return { transform: `translate(${(vx * t).toFixed(1)}px, ${(vy * t + g * t * t / 2).toFixed(1)}px) rotate(${(rot * k / 30).toFixed(1)}deg) scale(${sc})`, opacity: k > 24 ? 1 - (k - 24) / 6 : 1 }; });
    e.animate(frames, { duration: T * 1000, delay, easing: "linear", fill: "both" }).onfinish = () => e.remove();
  }
}
function bindSwipe(i) {
  const card = document.querySelector(`figure[data-i="${i}"] .card.top`); if (!card) return;
  let x0 = null, dx = 0;
  card.addEventListener("pointerdown", e => { if (e.target.closest("button,[data-shuffle],[contenteditable]:focus")) return; x0 = e.clientX; dx = 0; try { card.setPointerCapture(e.pointerId); } catch {} card.style.transition = "none"; });
  card.addEventListener("pointermove", e => { if (x0 === null) return; const z = card.closest(".phone").getBoundingClientRect().width / 402; dx = (e.clientX - x0) / z; card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; });
  const end = () => { if (x0 === null) return; x0 = null; if (Math.abs(dx) > 100) return decide(i, card, Math.sign(dx)); card.style.transition = "transform .3s cubic-bezier(.2,1.3,.4,1)"; card.style.transform = "none"; };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}
function build() {
  document.getElementById("grid").innerHTML = VARIANTS.map((v, i) => `<figure data-i="${i}"><div class="device">
    <div class="phone"></div>
    <div class="chrome"><img class="sb" src="status-bar.svg" alt=""></div>
    <img class="frame" src="bezel-frame.png" alt=""></div></figure>`).join("");
  VARIANTS.forEach((_, i) => draw(i));
}
document.addEventListener("click", e => {
  if (e.target.id === "end") { PLANS = ORIG; state = VARIANTS.map(() => ({ ...fresh(), gone: PLANS.map(p => p.name), sent: PLANS.map(p => p.name) })); build(); return; }
  if (e.target.closest(".end-acts .btn2, .end-acts [data-cal]") || (e.target.closest(".end-acts .btn1") && e.target.textContent === "Check your calendar")) {
    const a = document.createElement("a"); a.href = "https://calendar.google.com/calendar/r/week"; a.target = "_blank"; a.rel = "noopener"; a.click(); return;
  }
  const cfb = e.target.closest("[data-cf]"); if (cfb) { CONFETTI = cfb.dataset.cf; document.querySelectorAll(".cfp").forEach(b => b.style.borderColor = b === cfb ? "#fff" : ""); confetti(document.querySelector(".phone"), "Miss Kim"); return; }
  if (e.target.id === "jump") { const st = state[0]; if (st.phase !== "saved") return; PLANS = nextWeekPlans(st.picked); state[0] = { ...fresh(), week: 1, enter: true }; _draw(0); state[0].enter = false; return; }
  if (e.target.id === "reset") { PLANS = ORIG; state = VARIANTS.map(() => fresh()); build(); return; }
  const fig = e.target.closest("figure"); if (fig) {
    const i = +fig.dataset.i, st = state[i];
    if (st.phase === "deck" && e.target.closest(".end-acts .btn1") && !e.target.closest("[data-save],[data-jump]")) { st.phase = "pick"; st.picked = NEXT_PEOPLE.slice(0, 3).map(p => p.name); _draw(i); return; }
    const pk = e.target.closest("[data-pick]");
    if (pk) { const n = pk.dataset.pick; st.picked = st.picked.includes(n) ? st.picked.filter(x => x !== n) : [...st.picked, n];
      pk.classList.toggle("on"); fig.querySelector("[data-save]").disabled = !st.picked.length; return; }
    if (e.target.closest("[data-save]")) { st.phase = "saved"; _draw(i); return; }
    if (e.target.closest("[data-jump]")) { PLANS = nextWeekPlans(st.picked); state[i] = { ...fresh(), week: 1, enter: true }; _draw(i); state[i].enter = false; return; }
  }
  const b = e.target.closest("[data-send],[data-skip]"); if (!b) return;
  const card = b.closest(".card"); if (!card.classList.contains("top")) return;
  decide(+b.closest("figure").dataset.i, card, b.hasAttribute("data-send") ? 1 : -1);
});
// Edit the place in the text → the invite follows. Known Ann Arbor spots first (any case),
// otherwise the capitalized words after "at" / "get" / "to".
const PLACES = ["Sava's", "Mister Spots", "sweetgreen", "Kang's", "No Thai", "South U Pizza", "BTB Burrito", "Good Time Charley's", "Raising Cane's"];
function findPlace(t) {
  const low = t.toLowerCase().replace(/[’]/g, "'");
  let best = null;
  for (const p of PLACES) { const i = low.indexOf(p.toLowerCase()); if (i >= 0 && (!best || i < best.i)) best = { i, p }; }
  if (best) return best.p;
  const m = t.match(/\b(?:at|get|to|try)\s+((?:[A-Z][\w'’&]*\s?){1,3})/);
  return m ? m[1].trim() : null;
}
document.addEventListener("input", e => {
  const el = e.target.closest(".plan"); if (!el) return;
  const card = el.closest(".card"), idea = IDEAS[card.dataset.name], text = el.innerText;
  idea.text = text;
  const place = findPlace(text); if (!place) return;
  idea.place = place;
  card.querySelectorAll(".ev b, .what b, .big small").forEach(n => n.textContent = place);
});
addEventListener("resize", fit);
fit();
// Made-up plans: one person a day starting tomorrow, with a couple of busy blocks each.
(function demoPlans() {
  const day = (d, h, m = 0) => { const t = new Date(); t.setDate(t.getDate() + d); t.setHours(h, m, 0, 0); return t.toISOString(); };
  const spec = [
    { name: "Maya", d: 1, h: 19, busy: [[17, 18.5]], theirs: [[20.5, 22]] },
    { name: "Jonah", d: 2, h: 19, busy: [[16, 17.25]], theirs: [[20, 23]] },
    { name: "Priya", d: 3, h: 12.5, busy: [[10, 11.5]], theirs: [[14, 15.5]] },
    { name: "Leo", d: 4, h: 18, busy: [[19.5, 21]], theirs: [] },
  ];
  const hm = h => [Math.floor(h), Math.round((h % 1) * 60)];
  PLANS = spec.map(p => {
    const s = day(p.d, ...hm(p.h)), e = day(p.d, ...hm(p.h + 1));
    const when = p.d === 1 ? "tomorrow" : "this " + new Date(s).toLocaleDateString("en-US", { weekday: "long" });
    IDEAS[p.name].text = `Hi! Let's get ${IDEAS[p.name].place} ${when}!`;
    return { name: p.name, start: s, end: e, busy: { mine: p.busy.map(([a, z]) => ({ start: day(p.d, ...hm(a)), end: day(p.d, ...hm(z)) })),
                                                 theirs: p.theirs.map(([a, z]) => ({ start: day(p.d, ...hm(a)), end: day(p.d, ...hm(z)) })) } };
  });
  ORIG = PLANS;
  build();
})();

  <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .8C5.2.8 2.7 1.9.8 3.7L2 5c1.6-1.5 3.7-2.4 6-2.4zm0 3.5c1.3 0 2.5.5 3.5 1.3l1.2-1.3A7 7 0 0 0 8 4.3c-1.8 0-3.4.7-4.7 1.8l1.2 1.3c1-.8 2.2-1.3 3.5-1.3zm0 3.5c.5 0 .9.2 1.2.5L8 11.4 6.8 10.1c.3-.3.7-.5 1.2-.5z"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" fill-opacity=".4"/></svg>`; }   // a function so it is ready before the first draw
function endHTML(st, v) {
  const ppl = PLANS.filter(p => st.sent.includes(p.name)).sort((a, b) => new Date(a.start) - new Date(b.start));
  const when = d => { const t = new Date(); t.setHours(0, 0, 0, 0); const n = Math.round((new Date(d).setHours(0, 0, 0, 0) - t) / 864e5);

    return day + " " + fmtS(new Date(d)) + (new Date(d).getHours() < 12 ? " am" : " pm"); };
  const title = ppl.length ? (ppl.length === 1 ? "1 plan made" : ppl.length + " plans made") : "All caught up";

    <div class="elist">${ppl.map((p, k) => `<div class="erow" data-name="${p.name}"><button class="edel" aria-label="Delete plan with ${p.name}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h14M7.5 5V3.6c0-.6.4-1 1-1h3c.6 0 1 .4 1 1V5M4.7 5l.8 11.2c.1 1 .8 1.6 1.7 1.6h5.6c1 0 1.6-.7 1.7-1.6L15.3 5"/></svg></button><div class="ec" style="animation-delay:${350 + k * 90}ms">
      <div class="hd"><div class="photo">${p.name[0]}</div><b>${p.name}</b><span>${when(p.start)}</span></div>
      <div class="pl">${(ideaFor ? ideaFor(0, p.name) : IDEAS[p.name]).place}</div></div></div>`).join("")}</div>
    <div class="end-acts" style="animation-delay:${450 + ppl.length * 90}ms"><button class="btn1">Who do you want to see?</button><button class="btn2">Check your calendar</button></div>`;
}

// swipe a plan card left to reveal its trash button; tap it to remove the plan
(() => {
  const OPEN = 76; let row = null, x0 = 0, y0 = 0, base = 0, dx = 0, drag = false;
  const ecOf = r => r.querySelector(".ec"), z = r => r.closest(".phone").getBoundingClientRect().width / 402;
  const setX = (r, x, anim) => { const ec = ecOf(r), del = r.querySelector(".edel");
    const t = Math.min(1, -x / OPEN);   // spring(response .35, damping .8)
    const sp = ".35s cubic-bezier(.25,1.1,.4,1)";
    ec.style.transition = anim ? `translate ${sp}, scale .2s ease` : "scale .2s ease"; del.style.transition = anim ? `opacity ${sp}, scale ${sp}` : "none";
    ec.style.translate = x ? `${x}px 0` : ""; del.style.opacity = t; del.style.scale = .6 + .4 * t; r.dataset.x = x; };
  const closeAll = except => document.querySelectorAll(".erow").forEach(r => { if (r !== except && +r.dataset.x) setX(r, 0, true); });
  document.addEventListener("pointerdown", e => {
    if (e.target.closest(".edel")) return;
    const r = e.target.closest(".erow"); closeAll(r); if (!r) return;
    if (+r.dataset.x) { setX(r, 0, true); return; }
    r.classList.add("pressed");
    row = r; x0 = e.clientX; y0 = e.clientY; base = +r.dataset.x || 0; dx = 0; drag = false;
  }, true);
  document.addEventListener("pointermove", e => { if (!row) return;
    const mx = (e.clientX - x0) / z(row), my = (e.clientY - y0) / z(row);
    if (!drag) { if (Math.hypot(mx, my) < 16) return; row.classList.remove("pressed"); if (Math.abs(my) > Math.abs(mx)) { row = null; return; } drag = true; }
    dx = Math.min(0, base + mx); if (dx < -OPEN) dx = -OPEN + (dx + OPEN) / 3; setX(row, dx, false); });
  const up = () => { document.querySelectorAll(".erow.pressed").forEach(r => r.classList.remove("pressed")); if (!row) return; if (drag) setX(row, dx < -OPEN / 2 ? -OPEN : 0, true); row = null; };
  document.addEventListener("pointerup", up); document.addEventListener("pointercancel", up);
  document.addEventListener("click", e => {
    const del = e.target.closest(".edel"); if (!del) return; e.stopPropagation();
    const r = del.closest(".erow"), name = r.dataset.name, fig = r.closest("figure"), st = state[+fig.dataset.i];
    st.sent = st.sent.filter(n => n !== name);
    const h = r.offsetHeight;
    r.animate([{ height: h + "px", opacity: 1, marginBottom: "0px" }, { height: "0px", opacity: 0, marginBottom: "-12px" }],
      { duration: 280, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" }).onfinish = () => r.remove();
    const n = st.sent.length, t = fig.querySelector(".etitle");
    if (t) t.textContent = n ? (n === 1 ? "1 plan made" : n + " plans made") : "All caught up";
  }, true);
})();
